services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartgrocery
      POSTGRES_PASSWORD: smartgrocery
      POSTGRES_DB: smartgrocery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrocery -d smartgrocery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
